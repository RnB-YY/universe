<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050915">
  <meta name="description" content="유상호的个人知识星系：学术发表、视觉作品与研究资料。">
  <title>YOO SANGHO · 个人知识星系</title>
  <link rel="stylesheet" href="styles.css?v=worlds-20261103c">
  <link rel="stylesheet" href="orbital.css?v=worlds-20261103c">
  <link rel="stylesheet" href="worlds.css?v=worlds-20261103c">
</head>
<body>
  <canvas id="cosmos" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="site-header">
    <a class="identity" href="#orbit" aria-label="返回个人知识星系首页">
      <span class="identity-mark">YS</span>
      <span><b>YOO SANGHO</b><small>ORBITAL ARCHIVE · 2026</small></span>
    </a>
    <nav class="header-actions" aria-label="页面工具">
      <button class="quiet-button" id="motionToggle" type="button" aria-pressed="false">暂停轨道</button>
      <button class="list-button" id="listToggle" type="button" aria-expanded="false" aria-controls="catalogue">全部项目</button>
    </nav>
  </header>

  <main id="orbit" class="orbit-stage" aria-label="个人知识星系">
    <div class="orbit-copy">
      <p class="eyebrow">A LIVING INDEX</p>
      <h1>让每一项研究<br>成为一颗可以抵达的星球</h1>
      <p class="orbit-intro">这里收纳我关于景观、生态、翻译与公共空间的学习轨迹。选择一颗行星，进入它的地表。</p>
    </div>

    <!-- Planets are positioned every frame by cosmos.js over the rendered bodies. -->
    <div class="system" id="system" aria-label="环绕恒星的四个内容星球">
      <div class="star" id="starAnchor" aria-label="个人知识星系的中心恒星">
        <span class="star-core"></span>
        <span class="star-name">유상호</span>
        <span class="star-sub">KNOWLEDGE IN ORBIT</span>
      </div>

      <button class="planet planet-academic" type="button" data-world="academic" aria-label="进入学术研究星球">
        <span class="planet-face"><i></i></span>
        <span class="planet-label"><b>学术研究</b><small>CANOPY · 02</small><em>硕士论文研究 · 课程发表 · 文献阅读</em></span>
      </button>
      <button class="planet planet-about" type="button" data-world="about" aria-label="进入个人简介星球">
        <span class="planet-face"><i></i></span>
        <span class="planet-label"><b>关于我</b><small>ORIGIN · 01</small><em>个人简介 · 研究方向</em></span>
      </button>
      <button class="planet planet-portfolio" type="button" data-world="portfolio" aria-label="进入设计作品星球">
        <span class="planet-face"><i></i></span>
        <span class="planet-label"><b>设计作品</b><small>BLOOM · 03</small><em>作品集项目 · 视觉实验 · 空间设计</em></span>
      </button>
      <button class="planet planet-archive" type="button" data-world="archive" aria-label="进入资料收藏星球">
        <span class="planet-face"><i></i></span>
        <span class="planet-label"><b>资料收藏</b><small>STRATA · 04</small><em>朋友分享 · 参考案例 · 待整理资料</em></span>
      </button>
    </div>

    <div class="orbit-guide" aria-hidden="true">
      <span>01 — 选择行星</span><span>02 — 观测地表信号</span><span>03 — 降落到区域</span>
    </div>
  </main>

  <aside class="catalogue" id="catalogue" aria-hidden="true">
    <div class="catalogue-head">
      <div><p class="eyebrow">DIRECT ACCESS</p><h2>全部项目</h2></div>
      <button class="icon-button" id="listClose" type="button" aria-label="关闭全部项目">×</button>
    </div>
    <p class="catalogue-note">按星球与分类浏览，或搜索主题、标题和项目内容。</p>
    <label class="filter-label" for="projectSearch">搜索项目</label><input id="projectSearch" type="search" placeholder="例如：老龄化、生态、朋友分享">
    <div class="filter-grid"><label>星球<select id="worldFilter"></select></label><label>分类<select id="categoryFilter"></select></label><label>语言<select id="languageFilter"><option value="">全部语言</option><option>韩语</option><option>中文</option></select></label><label>年份<select id="yearFilter"><option value="">全部年份</option><option>2026</option><option>未标注</option></select></label></div>
    <button class="quiet-button" id="clearFilters" type="button">重置筛选</button><p id="resultCount" role="status" aria-live="polite"></p><div id="projectResults"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>


  <dialog class="artifact-panel" id="artifactPanel">
    <button class="icon-button panel-close" id="artifactClose" type="button" aria-label="关闭项目详情">×</button>
    <p class="artifact-type" id="artifactType">ACADEMIC PROJECT</p>
    <h2 id="artifactTitle">项目名称</h2>
    <p class="artifact-meta" id="artifactMeta">2026 · HTML</p>
    <p class="artifact-description" id="artifactDescription"></p>
    <div class="artifact-links" id="artifactLinks"></div>
    <p class="artifact-foot">节点会随着新的内容继续生长。</p>
  </dialog>

  <script src="cosmos.js?v=worlds-20261103c"></script>
  <script src="app.js?v=worlds-20261103c"></script>
  <script src="worlds-data.js?v=worlds-20261103c"></script>
  <script src="worlds.js?v=worlds-20261103c"></script>
</body>
</html>
